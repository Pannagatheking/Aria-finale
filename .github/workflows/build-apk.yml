# ARIA Control APK builder. GitHub builds the Android app from the project packed below.
# After it finishes: repo > Releases > "ARIA Control APK" > ARIA-Control.apk
name: Build ARIA Control APK
on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Unpack the Android project
        run: |
          mkdir -p apk
          echo '' | base64 -d | tar xz -C apk
          find apk -type f
      - name: Build the APK
        working-directory: apk
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp apk/app/build/outputs/apk/debug/app-debug.apk ARIA-Control.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ARIA-Control-apk
          path: ARIA-Control.apk
      - name: Publish for easy download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: control-${{ github.run_number }}
          name: ARIA Control APK ${{ github.run_number }}
          body: Install ARIA-Control.apk on the family phone (allow "install unknown apps").
          files: ARIA-Control.apk
